<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>micro:bit Visualizador</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.5.0/dist/Recharts.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

        // Iconos SVG
        const PlayIcon = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
        );

        const PauseIcon = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
        );

        const TrashIcon = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
        );

        const DownloadIcon = () => (
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        );

        function MicrobitDataVisualizer() {
            const [port, setPort] = useState(null);
            const [isConnected, setIsConnected] = useState(false);
            const [isReading, setIsReading] = useState(false);
            const [rawData, setRawData] = useState([]);
            const [displayData, setDisplayData] = useState([]);
            const [selectedPoints, setSelectedPoints] = useState(new Set());
            const [timeInterval, setTimeInterval] = useState(100);
            const readerRef = useRef(null);
            const keepReadingRef = useRef(false);

            // Verificar soporte de Web Serial API
            useEffect(() => {
                if (!('serial' in navigator)) {
                    alert('Tu navegador no soporta Web Serial API. Usa Chrome, Edge o Opera.');
                }
            }, []);

            // Conectar al puerto serial
            const connectSerial = async () => {
                try {
                    const selectedPort = await navigator.serial.requestPort();
                    await selectedPort.open({ baudRate: 115200 });
                    setPort(selectedPort);
                    setIsConnected(true);
                    startReading(selectedPort);
                } catch (err) {
                    console.error('Error al conectar:', err);
                    alert('No se pudo conectar al puerto serial');
                }
            };

            // Leer datos del puerto serial
            const startReading = async (serialPort) => {
                keepReadingRef.current = true;
                setIsReading(true);
                
                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = serialPort.readable.pipeTo(textDecoder.writable);
                const reader = textDecoder.readable.getReader();
                readerRef.current = reader;

                let buffer = '';
                
                try {
                    while (keepReadingRef.current) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        
                        buffer += value;
                        const lines = buffer.split('\n');
                        buffer = lines.pop();
                        
                        lines.forEach(line => {
                            const trimmed = line.trim();
                            if (trimmed) {
                                const numValue = parseFloat(trimmed);
                                if (!isNaN(numValue)) {
                                    const timestamp = Date.now();
                                    setRawData(prev => [...prev, { time: timestamp, value: numValue, id: `${timestamp}-${Math.random()}` }]);
                                }
                            }
                        });
                    }
                } catch (err) {
                    console.error('Error al leer:', err);
                } finally {
                    reader.releaseLock();
                }
            };

            // Detener lectura
            const stopReading = () => {
                keepReadingRef.current = false;
                setIsReading(false);
            };

            // Desconectar
            const disconnect = async () => {
                stopReading();
                if (port) {
                    try {
                        await port.close();
                    } catch (err) {
                        console.error('Error al cerrar puerto:', err);
                    }
                    setPort(null);
                    setIsConnected(false);
                }
            };

            // Actualizar datos mostrados según el intervalo
            useEffect(() => {
                if (rawData.length === 0) {
                    setDisplayData([]);
                    return;
                }

                const filtered = rawData.filter((_, idx) => idx % Math.max(1, Math.floor(timeInterval / 10)) === 0);
                setDisplayData(filtered.map((d, idx) => ({ ...d, index: idx })));
            }, [rawData, timeInterval]);

            // Eliminar puntos seleccionados
            const deleteSelected = () => {
                setRawData(prev => prev.filter(d => !selectedPoints.has(d.id)));
                setSelectedPoints(new Set());
            };

            // Eliminar punto individual
            const deletePoint = (id) => {
                setRawData(prev => prev.filter(d => d.id !== id));
                setSelectedPoints(prev => {
                    const newSet = new Set(prev);
                    newSet.delete(id);
                    return newSet;
                });
            };

            // Editar valor
            const editValue = (id, newValue) => {
                setRawData(prev => prev.map(d => d.id === id ? { ...d, value: parseFloat(newValue) || d.value } : d));
            };

            // Exportar datos
            const exportData = () => {
                const csv = 'Timestamp,Value\n' + rawData.map(d => `${d.time},${d.value}`).join('\n');
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'microbit_data.csv';
                a.click();
            };

            // Manejar clic en la gráfica
            const handleChartClick = (data) => {
                if (data && data.activePayload && data.activePayload[0]) {
                    const point = data.activePayload[0].payload;
                    setSelectedPoints(prev => {
                        const newSet = new Set(prev);
                        if (newSet.has(point.id)) {
                            newSet.delete(point.id);
                        } else {
                            newSet.add(point.id);
                        }
                        return newSet;
                    });
                }
            };

            return (
                <div className="min-h-screen bg-white p-8">
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <div className="border-b-2 border-black pb-6 mb-8">
                            <h1 className="text-4xl font-bold mb-2">micro:bit Data Visualizer</h1>
                            <p className="text-gray-600">Captura, edita y visualiza datos en tiempo real</p>
                        </div>

                        {/* Controles de conexión */}
                        <div className="mb-8 flex gap-4 items-center flex-wrap">
                            {!isConnected ? (
                                <button
                                    onClick={connectSerial}
                                    className="px-6 py-3 bg-black text-white font-semibold hover:bg-gray-800 transition-colors"
                                >
                                    Conectar micro:bit
                                </button>
                            ) : (
                                <>
                                    <button
                                        onClick={isReading ? stopReading : () => startReading(port)}
                                        className="px-6 py-3 bg-black text-white font-semibold hover:bg-gray-800 transition-colors flex items-center gap-2"
                                    >
                                        {isReading ? <><PauseIcon /> Pausar</> : <><PlayIcon /> Reanudar</>}
                                    </button>
                                    <button
                                        onClick={disconnect}
                                        className="px-6 py-3 border-2 border-black font-semibold hover:bg-gray-100 transition-colors"
                                    >
                                        Desconectar
                                    </button>
                                    <div className="ml-auto flex items-center gap-2">
                                        <span className="font-semibold">Puntos: {rawData.length}</span>
                                    </div>
                                </>
                            )}
                        </div>

                        {/* Controles de intervalo y acciones */}
                        <div className="mb-8 p-6 border-2 border-black">
                            <div className="flex items-center gap-6 flex-wrap">
                                <div className="flex items-center gap-3">
                                    <label className="font-semibold">Intervalo de muestreo (ms):</label>
                                    <input
                                        type="number"
                                        value={timeInterval}
                                        onChange={(e) => setTimeInterval(Math.max(1, parseInt(e.target.value) || 100))}
                                        className="w-24 px-3 py-2 border-2 border-black focus:outline-none"
                                        min="1"
                                    />
                                </div>
                                
                                <button
                                    onClick={deleteSelected}
                                    disabled={selectedPoints.size === 0}
                                    className="px-4 py-2 bg-black text-white font-semibold hover:bg-gray-800 transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center gap-2"
                                >
                                    <TrashIcon />
                                    Eliminar seleccionados ({selectedPoints.size})
                                </button>

                                <button
                                    onClick={exportData}
                                    disabled={rawData.length === 0}
                                    className="px-4 py-2 border-2 border-black font-semibold hover:bg-gray-100 transition-colors disabled:border-gray-300 disabled:text-gray-300 disabled:cursor-not-allowed flex items-center gap-2"
                                >
                                    <DownloadIcon />
                                    Exportar CSV
                                </button>

                                <button
                                    onClick={() => {
                                        setRawData([]);
                                        setSelectedPoints(new Set());
                                    }}
                                    className="px-4 py-2 border-2 border-black font-semibold hover:bg-gray-100 transition-colors"
                                >
                                    Limpiar todo
                                </button>
                            </div>
                        </div>

                        {/* Gráfica y tabla */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            {/* Gráfica */}
                            <div className="lg:col-span-2 border-2 border-black p-6">
                                <h2 className="text-2xl font-bold mb-4">Gráfica</h2>
                                {displayData.length === 0 ? (
                                    <div className="h-96 flex items-center justify-center text-gray-400">
                                        <p>Esperando datos...</p>
                                    </div>
                                ) : (
                                    <ResponsiveContainer width="100%" height={400}>
                                        <LineChart data={displayData} onClick={handleChartClick}>
                                            <CartesianGrid strokeDasharray="3 3" stroke="#000" />
                                            <XAxis 
                                                dataKey="index" 
                                                stroke="#000"
                                                label={{ value: 'Muestra', position: 'insideBottom', offset: -5 }}
                                            />
                                            <YAxis 
                                                stroke="#000"
                                                label={{ value: 'Valor', angle: -90, position: 'insideLeft' }}
                                            />
                                            <Tooltip 
                                                contentStyle={{ border: '2px solid black', backgroundColor: 'white' }}
                                            />
                                            <Line 
                                                type="monotone" 
                                                dataKey="value" 
                                                stroke="#000" 
                                                strokeWidth={2}
                                                dot={(props) => {
                                                    const isSelected = selectedPoints.has(props.payload.id);
                                                    return (
                                                        <circle
                                                            cx={props.cx}
                                                            cy={props.cy}
                                                            r={isSelected ? 6 : 3}
                                                            fill={isSelected ? '#ff0000' : '#000'}
                                                            stroke={isSelected ? '#000' : 'none'}
                                                            strokeWidth={isSelected ? 2 : 0}
                                                        />
                                                    );
                                                }}
                                            />
                                        </LineChart>
                                    </ResponsiveContainer>
                                )}
                                <p className="text-sm text-gray-600 mt-4">
                                    Haz clic en los puntos de la gráfica para seleccionarlos/deseleccionarlos
                                </p>
                            </div>

                            {/* Tabla de datos */}
                            <div className="border-2 border-black p-6 max-h-[600px] overflow-hidden flex flex-col">
                                <h2 className="text-2xl font-bold mb-4">Datos</h2>
                                <div className="overflow-y-auto flex-1">
                                    {displayData.length === 0 ? (
                                        <p className="text-gray-400">Sin datos</p>
                                    ) : (
                                        <table className="w-full">
                                            <thead className="border-b-2 border-black sticky top-0 bg-white">
                                                <tr>
                                                    <th className="text-left py-2 font-semibold">#</th>
                                                    <th className="text-left py-2 font-semibold">Valor</th>
                                                    <th className="text-left py-2 font-semibold"></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {displayData.map((d, idx) => (
                                                    <tr 
                                                        key={d.id} 
                                                        className={`border-b border-gray-300 ${selectedPoints.has(d.id) ? 'bg-gray-200' : ''}`}
                                                    >
                                                        <td className="py-2">{idx + 1}</td>
                                                        <td className="py-2">
                                                            <input
                                                                type="number"
                                                                value={d.value}
                                                                onChange={(e) => editValue(d.id, e.target.value)}
                                                                className="w-full px-2 py-1 border border-black focus:outline-none"
                                                                step="0.01"
                                                            />
                                                        </td>
                                                        <td className="py-2">
                                                            <button
                                                                onClick={() => deletePoint(d.id)}
                                                                className="hover:text-red-600 transition-colors"
                                                            >
                                                                <TrashIcon />
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Instrucciones */}
                        <div className="mt-8 p-6 border-2 border-black bg-gray-50">
                            <h3 className="text-xl font-bold mb-3">Instrucciones de uso</h3>
                            <ol className="list-decimal list-inside space-y-2">
                                <li>Conecta tu micro:bit por USB al ordenador</li>
                                <li>Haz clic en "Conectar micro:bit" y selecciona el puerto USB</li>
                                <li>Los datos comenzarán a aparecer automáticamente en la gráfica</li>
                                <li>Ajusta el intervalo de muestreo para controlar cuántos puntos se muestran</li>
                                <li>Haz clic en puntos de la gráfica o usa la tabla para seleccionar y eliminar datos</li>
                                <li>Edita valores directamente en la tabla</li>
                                <li>Exporta los datos en formato CSV cuando quieras</li>
                            </ol>
                        </div>
                    </div>
                </div>
            );
        }

        // Renderizar la aplicación
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MicrobitDataVisualizer />);
    </script>
</body>
</html>
